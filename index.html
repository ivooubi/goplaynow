
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoPlayNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#2430e8; --bg2:#1a23b5; --ink:#0d0f2b; --paper:#fbfbff; --paper2:#e4e7ff;
  --accent:#ffd23f; --good:#1fbf6a; --bad:#ff4d5e; --mid:#ffb02e; --muted:#c9ceff;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:#fff; font:400 16px/1.45 var(--body);
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.5px);
  background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3,p{margin:0}
button{font:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:18px;min-width:0}
.btn{display:block;width:100%;font:800 17px/1.1 var(--display);background:var(--accent);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:14px 18px;cursor:pointer;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--paper)}
.btn.small{width:auto;display:inline-block;padding:9px 14px;font-size:15px}
.ghost{background:rgba(13,15,43,.35);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}

/* Home */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:800 clamp(36px,12.5vw,58px)/.9 var(--display);letter-spacing:-.04em;text-transform:uppercase}
.brand small{display:block;font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--accent);margin-top:8px;text-transform:uppercase}
.lvl{flex:1 1 100%;display:flex;align-items:center;gap:12px;min-width:0;background:var(--ink);border-radius:14px;padding:10px 12px;border:2px solid rgba(255,255,255,.35)}
.lvl>div:first-child{flex:1;min-width:0}
.lvl b{display:block;font:800 15px var(--display)}
.lvl span{font:500 12px var(--mono);color:var(--muted)}
.xp{height:8px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:7px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--accent);border-radius:9px}
.ruler{position:relative;height:64px;margin-top:2px}
.ruler::before{content:"";position:absolute;left:0;right:0;bottom:10px;height:16px;
  background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 14px) bottom/100% 16px no-repeat}
.ruler::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:3px;background:#fff;border-radius:3px}
.flag{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;font:500 17px var(--mono);box-shadow:0 3px 0 var(--ink);transition:left .9s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.flag::after{content:"";position:absolute;left:50%;bottom:-9px;width:3px;height:9px;background:var(--ink);transform:translateX(-50%)}
.daily{background:var(--accent);display:flex;flex-direction:column;gap:10px}
.daily .tag{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.daily h2{font:800 28px/1 var(--display);letter-spacing:-.02em}
.daily p{font-size:15px}
.streak{display:inline-flex;gap:6px;align-items:center;font:500 14px var(--mono)}
.btn.dark{background:var(--ink);color:#fff}
.sect{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mode .ic{align-self:flex-start;background:var(--ink);color:var(--accent);font:500 14px var(--mono);padding:4px 9px;border-radius:9px}
.mode b{font:800 20px/1 var(--display)}
.mode span{font-size:14px;line-height:1.3}
.mode em{font:500 12px var(--mono);font-style:normal;color:#5a5f99;margin-top:auto}
.mode.logrobtn{flex-direction:row;justify-content:space-between;align-items:center;gap:10px;text-align:left}

/* Tienda */
.shop{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border:3px solid var(--accent);border-radius:16px;box-shadow:0 5px 0 var(--accent);padding:12px 14px;min-width:0}
.shop:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent)}
.shop:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shop .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:24px}
.shop .tx{flex:1;min-width:0}
.shop .tx b{display:block;font:800 20px/1.1 var(--display)}
.shop .tx span{font:500 13px/1.3 var(--mono);color:var(--muted)}
.shop .new{flex:none;background:var(--bad);color:#fff;font:800 12px var(--mono);padding:4px 9px;border-radius:99px;border:2px solid #fff}
.shop .go{flex:none;font:800 26px var(--display);color:var(--accent)}

/* Game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud-mid{font:500 14px var(--mono);display:flex;gap:10px;align-items:center;justify-content:center;flex:1;min-width:0}
.hud-mid b{font:800 16px var(--display)}
.hud-score{font:500 22px var(--mono);min-width:72px;text-align:right}
.lives{display:inline-flex;gap:4px}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}
.lives i.off{background:transparent;border-color:rgba(255,255,255,.5)}
.bar{height:10px;border-radius:9px;background:rgba(13,15,43,.4);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tag{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#4a4f8f}
.ev{font:800 clamp(22px,6.4vw,28px)/1.12 var(--display);letter-spacing:-.02em;margin-top:8px;text-wrap:balance}
.year{font:500 clamp(52px,17vw,76px)/1 var(--mono);text-align:center;letter-spacing:-.04em;margin:6px 0 0}
.bounds{display:flex;justify-content:space-between;font:500 13px var(--mono);color:#4a4f8f;margin-top:-2px}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.nudge button{background:var(--paper2);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:9px 0;font:500 16px var(--mono);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.nudge button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;margin:6px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:16px;box-sizing:border-box;background:var(--paper2);border:3px solid var(--ink);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-10px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-track{height:10px;background:var(--paper2);border:3px solid var(--ink);border-radius:99px}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--accent);border:3px solid var(--ink)}
input[type=range]:disabled{opacity:.6}

.fb{border-radius:16px;border:3px solid var(--ink);padding:14px;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:6px}
.fb.good{background:#9df0c3}.fb.mid{background:#ffe08a}.fb.bad{background:#ffb3bb}
.fb .big{font:800 26px/1.05 var(--display);letter-spacing:-.02em}
.fb .pts{font:500 15px var(--mono)}
.fb p{font-size:15px}
.scale{position:relative;height:74px;margin:6px 8px 0}
.scale .line{position:absolute;left:0;right:0;top:35px;height:4px;background:var(--ink);border-radius:4px}
.pin{position:absolute;transform:translateX(-50%);font:500 13px var(--mono);padding:2px 8px;border:2px solid var(--ink);border-radius:9px;white-space:nowrap;background:var(--paper)}
.pin.me{top:0}
.pin.real{bottom:0;background:var(--ink);color:var(--accent)}
.dot{position:absolute;top:29px;width:16px;height:16px;transform:translateX(-50%);border-radius:50%;border:3px solid var(--ink)}
.dot.me{background:var(--paper)}.dot.real{background:var(--accent)}

.opts{display:flex;flex-direction:column;gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:16px;font:800 clamp(18px,5vw,22px)/1.15 var(--display);letter-spacing:-.01em;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.opt:active:not(.lock){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt .yr{font:500 18px var(--mono);display:none}
.opt.lock{cursor:default}
.opt.lock .yr{display:block}
.opt.ok{background:#9df0c3}.opt.no{background:#ffb3bb}
.vs{align-self:center;font:500 14px var(--mono);color:var(--muted);margin:-4px 0}
.ord{display:flex;flex-direction:column;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.ord button,.ord li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--paper2);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px;font:700 17px/1.2 var(--body);min-width:0;width:100%}
.ord button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ord .n{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:500 16px var(--mono);background:var(--paper)}
.ord button.sel{background:var(--accent)}
.ord button.sel .n{background:var(--ink);color:var(--accent)}
.ord li{cursor:default}
.ord li.ok{background:#9df0c3}.ord li.no{background:#ffb3bb}
.ord .y{margin-left:auto;font:500 15px var(--mono);flex:none}
.numrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.numrow input{flex:1;min-width:0;font:500 clamp(28px,9vw,40px) var(--mono);color:var(--ink);background:var(--paper2);border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.numrow input:disabled{opacity:.7}
.numrow span{font:700 15px var(--body);max-width:40%}
.msg{font:500 14px var(--mono);color:#b00020;min-height:20px;margin-top:6px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}

/* End */
.endcard{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.endcard h2{font:800 30px/1 var(--display);letter-spacing:-.02em}
.score{font:500 clamp(54px,18vw,80px)/1 var(--mono);letter-spacing:-.04em}
.stars{display:flex;gap:8px}
.stars i{width:34px;height:34px;background:var(--paper2);border:3px solid var(--ink);clip-path:none;border-radius:50%}
.stars i.on{background:var(--accent)}
.squares{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.squares i{width:24px;height:24px;border-radius:7px;border:3px solid var(--ink)}
.squares .g{background:var(--good)}.squares .y{background:var(--mid)}.squares .r{background:var(--bad)}
.xpgain{font:500 14px var(--mono);color:#4a4f8f}
textarea.share{width:100%;height:96px;resize:none;font:500 14px/1.4 var(--mono);border:3px solid var(--ink);border-radius:12px;background:var(--paper2);color:var(--ink);padding:10px}

/* Logros */
.logros{display:flex;flex-direction:column;gap:12px}
.lg{display:flex;gap:12px;align-items:center}
.lg .badge{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:500 14px var(--mono);background:var(--paper2)}
.lg.done .badge{background:var(--accent)}
.lg b{font:800 17px/1.1 var(--display)}
.lg p{font-size:14px;color:#4a4f8f}
.lg .pg{height:7px;border-radius:9px;background:var(--paper2);border:2px solid var(--ink);margin-top:6px;overflow:hidden}
.lg .pg i{display:block;height:100%;background:var(--ink)}
.lg>div{min-width:0;flex:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
#toast div{background:var(--ink);color:#fff;border:3px solid var(--accent);border-radius:14px;padding:10px 14px;font:700 15px var(--body);box-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop .35s}
#toast b{color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.cf{position:absolute;left:50%;top:48%;width:10px;height:15px;border-radius:2px;animation:cf 1.2s cubic-bezier(.25,.6,.45,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}35%{transform:translate(calc(var(--dx)*.7),var(--up)) rotate(calc(var(--rot)*.4));opacity:1}100%{transform:translate(var(--dx),var(--down)) rotate(var(--rot));opacity:0}}
.flash{position:absolute;inset:0;animation:flash .6s ease-out forwards}
.flash.good{background:radial-gradient(circle at 50% 50%,rgba(31,191,106,0) 35%,rgba(31,191,106,.5))}
.flash.bad{background:radial-gradient(circle at 50% 50%,rgba(255,77,94,0) 30%,rgba(255,77,94,.65))}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.float{position:absolute;left:50%;top:38%;font:800 clamp(40px,12vw,58px)/1 var(--display);color:var(--accent);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:rise 1.05s ease-out forwards;white-space:nowrap}
.float.bad{color:var(--bad)}
.float.lab{top:26%;font-size:clamp(26px,8vw,36px);color:#fff}
@keyframes rise{0%{transform:translate(-50%,16px) scale(.5);opacity:0}20%{transform:translate(-50%,-6px) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
@keyframes bounce{0%{transform:scale(.82)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes shakeAll{0%,100%{transform:none}15%{transform:translate(-9px,3px)}35%{transform:translate(8px,-3px)}55%{transform:translate(-6px,2px)}75%{transform:translate(4px,-1px)}}
.fb.good{animation:bounce .55s cubic-bezier(.3,1.5,.5,1)}
.fb.bad{animation:wobble .5s}
.opt.ok{animation:bounce .55s cubic-bezier(.3,1.5,.5,1)}
.opt.no{animation:wobble .5s}
.ord li.ok{animation:bounce .5s both}
.ord li.no{animation:wobble .5s both}
body.hit .app{animation:shakeAll .45s}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 11px 3px 4px;font:500 14px var(--mono)}
.coinpill.big{font-size:18px;padding:4px 14px 4px 5px}
.coinpill.pulse{animation:pulse .3s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.coin{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffd23f 55%,#e0a800);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18);font:800 11px/1 var(--display);color:var(--ink);font-style:normal}
.coin::after{content:"✦"}
.coinpill.big .coin{width:26px;height:26px;font-size:14px}
.coin.fly{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.fb .pts.coinline{font-weight:500}
.ms{display:flex;flex-direction:column;gap:10px}
.msrow{display:flex;gap:12px;align-items:center}
.msrow>div{min-width:0;flex:1}
.msrow b{font:800 17px/1.1 var(--display)}
.msrow p{font-size:14px;color:#4a4f8f}
.msrow .btn{width:auto;flex:none;padding:10px 14px;font-size:15px}
.msrow.done{opacity:.6}
.sw{flex:none;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink)}
.hintbtn{margin-top:10px}
.pg2{height:8px;border-radius:9px;background:var(--paper2);border:2px solid var(--ink);margin-top:6px;overflow:hidden}
.pg2 i{display:block;height:100%;background:var(--ink)}
.plain{font-size:15px;color:#2b2e5e}
.game{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px;min-width:0}
.game:active:not(.soon){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.game .gi{flex:none;width:58px;height:58px;border-radius:14px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font:800 18px var(--display)}
.game .tx{flex:1;min-width:0}
.game .tx b{display:block;font:800 22px/1 var(--display)}
.game .tx p{font-size:14px;line-height:1.3;margin-top:4px}
.game .tx em{display:block;font:500 12px var(--mono);font-style:normal;color:#5a5f99;margin-top:6px}
.game .go{flex:none;font:800 26px var(--display)}
.game.soon{cursor:default;border-style:dashed;opacity:.8;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:3px solid var(--ink);background:var(--paper2);color:var(--ink);border-radius:99px;padding:8px 14px;font:700 15px var(--body);cursor:pointer}
.chip.sel{background:var(--accent);box-shadow:0 3px 0 var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.step b{font:500 44px var(--mono)}
.step .btn{width:68px;font-size:24px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.names input{min-width:0;font:500 16px var(--body);color:var(--ink);background:var(--paper2);border:3px solid var(--ink);border-radius:12px;padding:10px}
.pal-board{display:grid;gap:6px;max-width:320px;margin:0 auto;width:100%}
.pal-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wt{aspect-ratio:1;display:grid;place-items:center;font:800 clamp(24px,8vw,34px) var(--display);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px}
.wt.f{background:var(--paper2);animation:pop .12s}
.wt.c{--c:var(--good);background:var(--c)}.wt.p{--c:var(--accent);background:var(--c)}.wt.a{--c:#9aa0d6;background:var(--c)}
.wt.rv{animation:reveal .5s both}

/* ---------- Utilidades ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var rnd=Math.random;
function pick(arr,n){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,n);}
function todayStr(d){d=d||new Date();var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

function parseNum(s){
  s=String(s).trim().replace(/\s/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.');}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'');}
  var n=parseFloat(s);return isFinite(n)?n:NaN;
}

var seenEv=new Set(S.seenEv||[]),seenEst=new Set(S.seenEst||[]);
var used=new Set(),usedEst=new Set(),seeded=false;
function persistSeen(){S.seenEv=Array.from(seenEv);S.seenEst=Array.from(seenEst);}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function takeFrom(len,seen,usedSet,n){
  var idx=range(len).filter(function(i){return (seeded||!seen.has(i))&&!usedSet.has(i);});
  if(idx.length<n&&!seeded){seen.clear();idx=range(len).filter(function(i){return !usedSet.has(i);});}
  if(idx.length<n){usedSet.clear();idx=range(len);}
  var ch=pick(idx,n);ch.forEach(function(i){usedSet.add(i);});return ch;
}
function takeEv(n){return takeFrom(EV.length,seenEv,used,n).map(function(i){return EV[i];});}
function takeEst(n){return takeFrom(EST.length,seenEst,usedEst,n).map(function(i){return EST[i];});}
function markEv(ev){if(G&&G.daily)return;var i=EV.indexOf(ev);if(i>-1)seenEv.add(i);}
function markEst(it){if(G&&G.daily)return;var i=EST.indexOf(it);if(i>-1)seenEst.add(i);}

/* ---------- Construcción de rondas ---------- */
function mkCirca(){
  var e=takeEv(1)[0],y=e[0];
  var W=y<1000?1200:y<1700?500:y<1900?250:100;
  var lo=y-Math.floor(W*(0.1+0.8*rnd())),hi=lo+W;
  if(hi>2026){hi=2026;lo=hi-W;}
  if(lo<1){lo=1;hi=1+W;}
  return {t:'circa',e:e,lo:lo,hi:hi,W:W};
}
function mkFirst(){
  var a=takeEv(1)[0],b,k=0;
  do{b=takeEv(1)[0];k++;}while(Math.abs(a[0]-b[0])<2&&k<40);
  return {t:'first',a:a,b:b};
}
function mkOrder(){
  var sel=[],ys={},k=0;
  while(sel.length<4&&k<120){var e=takeEv(1)[0];k++;if(!ys[e[0]]){ys[e[0]]=1;sel.push(e);}}
  return {t:'order',items:sel};
}
function mkEst(){return {t:'est',it:takeEst(1)[0]};}
function many(f,n){var r=[];for(var i=0;i<n;i++)r.push(f());return r;}
function shuffle(a){return pick(a,a.length);}

  mix:{name:'Mezcla total',ic:'MIX',desc:'Doce rondas de todo tipo.',n:12,make:function(){

var AC=null;
function beep(seq){
  if(S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    seq.forEach(function(n,i){
      var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.11;
      o.type=n[2]||'triangle';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+n[1]+0.03);
    });
  }catch(e){}
}
var CONF=['#ffd23f','#1fbf6a','#ff4d5e','#fbfbff','#7aa2ff','#ff8a3d'];
function fx(kind,pts,o){
  o=o||{};
  beep(kind==='good'?[[660,0.14],[880,0.14],[1320,0.24]]:kind==='mid'?[[600,0.14],[780,0.2]]:[[220,0.2,'sawtooth'],[160,0.34,'sawtooth']]);
  try{if(navigator.vibrate)navigator.vibrate(kind==='bad'?[60,40,60]:25);}catch(e){}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var f=$('#fx');
  var fl=el('div','flash '+(kind==='bad'?'bad':'good'));f.appendChild(fl);setTimeout(function(){fl.remove();},650);
  var n=kind==='good'?(o.big?80:o.light?14:36):kind==='mid'?(o.light?4:14):0;
  for(var i=0;i<n;i++){
    var c=el('i','cf');
    var dx=(Math.random()-0.5)*(o.big?520:360);
    c.style.cssText='background:'+CONF[i%CONF.length]+';--dx:'+dx+'px;--up:'+(-140-Math.random()*(o.big?260:160))+'px;--down:'+(180+Math.random()*260)+'px;--rot:'+((Math.random()-0.5)*900)+'deg;animation-delay:'+(Math.random()*90)+'ms';
    f.appendChild(c);(function(x){setTimeout(function(){x.remove();},1400);})(c);
  }
  if(kind==='bad'){document.body.classList.add('hit');setTimeout(function(){document.body.classList.remove('hit');},500);}
  var t=el('div','float '+(kind==='bad'?'bad':''),kind==='bad'?'Fallo':(pts>0?'+'+nf(pts):'')+'');
  if(t.textContent){f.appendChild(t);setTimeout(function(){t.remove();},1100);}
  if(o.label){var l=el('div','float lab',o.label);f.appendChild(l);setTimeout(function(){l.remove();},1300);}
}

  var r=[0,0,0,0,0],cnt={},i;
  for(i=0;i<5;i++){if(g[i]===w[i])r[i]=2;else cnt[w[i]]=(cnt[w[i]]||0)+1;}
  for(i=0;i<5;i++){if(r[i]!==2&&cnt[g[i]]>0){r[i]=1;cnt[g[i]]--;}}
  return r;
}
function wdStats(){

  var r0=wdGet(days[0]);if(!(r0&&r0.won))i=1;

function palGame(ds){
  var P=$('#palabra');P.innerHTML='';
  PW={ds:ds,word:wdWord(ds),res:wdRes(ds),cur:'',busy:false,rows:[],keys:{}};
  ghostBtn(P,'← Días',function(){renderPal();});
  P.appendChild(el('div','top','<h2 class="brand" style="font-size:36px">Palabreo<small>'+dateLabel(ds)+'</small></h2>'));
  var bd=el('div','pal-board');
  for(var i=0;i<6;i++){
    var row=el('div','pal-row'),tiles=[];
    for(var j=0;j<5;j++){var t=el('div','wt');tiles.push(t);row.appendChild(t);}
    PW.rows.push({el:row,tiles:tiles});bd.appendChild(row);
  }
  P.appendChild(bd);
  PW.res.g.forEach(function(g,i){var ev=wdEval(g,PW.word);PW.rows[i].tiles.forEach(function(t,k){t.textContent=g[k];t.className='wt '+'apc'[ev[k]];});});
  var kb=el('div','kb');
  ['QWERTYUIOP','ASDFGHJKLÑ','ZXCVBNM'].forEach(function(line,li){
    var kr=el('div','kr');
    if(li===2){var en=el('button','key w','⏎');en.type='button';en.setAttribute('aria-label','Enviar');en.addEventListener('click',function(){palKey('ENTER');});kr.appendChild(en);}
    line.split('').forEach(function(ch){var b=el('button','key',ch);b.type='button';b.addEventListener('click',function(){palKey(ch);});PW.keys[ch]=b;kr.appendChild(b);});
    if(li===2){var bk=el('button','key w','⌫');bk.type='button';bk.setAttribute('aria-label','Borrar');bk.addEventListener('click',function(){palKey('BACK');});kr.appendChild(bk);}
    kb.appendChild(kr);
  });
  P.appendChild(kb);
  palKb();
  show('palabra');
  if(PW.res.done)palEnd(PW.res.won,true);
}
function palKb(){
  var best={};
  PW.res.g.forEach(function(g){var ev=wdEval(g,PW.word);for(var i=0;i<5;i++){if(best[g[i]]===undefined||ev[i]>best[g[i]])best[g[i]]=ev[i];}});
  for(var ch in PW.keys){var b=PW.keys[ch];b.className='key'+(best[ch]===undefined?'':' '+'apc'[best[ch]]);}
}
function palDraw(){
  var row=PW.rows[PW.res.g.length];if(!row)return;
  row.tiles.forEach(function(t,i){var c=PW.cur[i]||'';t.textContent=c;t.className='wt'+(c?' f':'');});
}
function palKey(k){
  if(!PW||PW.busy||PW.res.done)return;
  if(k==='BACK'){PW.cur=PW.cur.slice(0,-1);palDraw();return;}
  if(k==='ENTER'){palSubmit();return;}
  if(PW.cur.length<5){PW.cur+=k;palDraw();}
}
function palSubmit(){
  var g=PW.cur,rowI=PW.res.g.length,row=PW.rows[rowI];
  if(g.length<5){row.el.classList.remove('shake');void row.el.offsetWidth;row.el.classList.add('shake');toast('Faltan letras');return;}
  var ev=wdEval(g,PW.word),won=g===PW.word;
  PW.res.g.push(g);PW.cur='';PW.busy=true;
  var done=won||PW.res.g.length>=6;
  if(done){PW.res.done=true;PW.res.won=won;}
  save();
  row.tiles.forEach(function(t,i){t.className='wt '+'apc'[ev[i]]+' rv';t.style.animationDelay=(i*220)+'ms';});
  beep([[520,0.08],[660,0.08]]);
  setTimeout(function(){PW.busy=false;palKb();if(done)palEnd(won,false);},5*220+450);
}
function palEnd(won,quiet){
  var P=$('#palabra'),r=PW.res,n=r.g.length,gain=0;
  if(!r.paid){r.paid=true;gain=won?5+(7-n)*3:2;S.coins+=gain;coinShown=S.coins;save();}
  if(!quiet)fx(won?'good':'mid',0,{big:won&&n<=2});
  var share='GoPlayNow · Palabreo '+PW.ds+' '+(won?n:'X')+'/6\n'+r.g.map(function(g){return wdEval(g,PW.word).map(function(v){return ['⬛','🟨','🟩'][v];}).join('');}).join('\n');
  var c=el('div','card endcard pop','<div class="tag">'+dateLabel(PW.ds)+'</div><h2>'+(won?(n===1?'¡Increíble!':n<=3?'¡Muy bien!':'¡Resuelta!'):'La palabra era')+'</h2><div class="score" style="font-size:clamp(40px,13vw,60px)">'+PW.word+'</div>'+(gain?'<div class="xpgain">+'+lus(gain)+'</div>':'')+'<div class="coinpill big"><i class="coin"></i><b class="cn">0</b></div>');
  P.appendChild(c);

    try{navigator.clipboard.writeText(share).then(function(){cp.textContent='Copiado';},function(){toast('No se pudo copiar');});}catch(e){toast('No se pudo copiar');}
  });

document.addEventListener('keydown',function(e){
  if(!PW||$('#palabra').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();palKey('ENTER');}
  else if(e.key==='Backspace'){palKey('BACK');}
  else{var u=String(e.key).toUpperCase();if(/^[A-ZÑ]$/.test(u))palKey(u);}
});

/* ---------- Partida ---------- */
var G=null;
function start(id){
  clearInterval(flagTimer);
  var m=MODES[id];
  used=new Set();usedEst=new Set();
  var rounds=id==='daily'?dailyRounds():m.make();
  G={mode:id,daily:id==='daily',fxBig:false,fxLabel:'',rounds:rounds,i:0,score:0,res:[],streak:0,bestStreak:0,correct:0,done:false,ended:false,
     coins:0,cur:'',timer:!!m.timer,lives:3,left:45000,total:45000,last:Date.now(),iv:null};
  if(G.timer){
    G.iv=setInterval(function(){
      if(G.ended)return;
      var now=Date.now();G.left-=now-G.last;G.last=now;
      if(G.left<=0){G.left=0;hud();endGame();return;}
      hud();
    },100);
  }
  coinShown=S.coins;pendingFly=0;
  show('game');
  renderRound();
}
$('#quit').addEventListener('click',function(){if(G){G.ended=true;clearInterval(G.iv);}renderHome();});

function hud(){
  setCoinNum(coinShown);
  $('#hudScore').textContent=nf(G.score);
  var m=MODES[G.mode];
  if(G.timer){
    $('#hudMid').innerHTML='<b>'+Math.ceil(G.left/1000)+' s</b><span class="lives">'+'<i></i>'.repeat(G.lives)+'<i class="off"></i>'.repeat(3-G.lives)+'</span>';
    $('#barFill').style.width=(G.left/G.total*100)+'%';
  }else{
    $('#hudMid').innerHTML='<b>'+m.name+'</b> '+Math.min(G.i+1,G.rounds.length)+'/'+G.rounds.length;
    $('#barFill').style.width=((G.i+(G.done?1:0))/G.rounds.length*100)+'%';
  }
}

function renderRound(){
  if(G.ended)return;
  G.done=false;
  var r=G.rounds[G.i],st=$('#stage');G.cur=r.t;
  st.innerHTML='';hud();
  ({circa:rCirca,first:rFirst,order:rOrder,est:rEst})[r.t](r,st);
}

function nextBtn(st){
  var last=G.i>=G.rounds.length-1;
  var b=el('button','btn',last?'Ver resultado':'Siguiente');b.type='button';
  b.addEventListener('click',next);st.appendChild(b);b.focus({preventScroll:true});
  return b;
}
function next(){
  if(G.ended)return;
  G.i++;
  if(G.i>=G.rounds.length){endGame();}else{renderRound();}
}
/* Cierra una ronda: suma, guarda ratio y muestra el cuadro de resultado */
function finishRound(pts,max,fb,st,auto){
  G.done=true;G.score+=pts;G.res.push(Math.min(1,pts/max));S.rounds++;hud();
  var ra=Math.min(1,pts/max);
  var coins=G.cur==='first'?(pts>0?(G.timer?2:4):0):Math.round(ra*10);
  if(G.fxBig)coins+=5;
  if(G.fxLabel&&G.fxLabel.indexOf('Racha')===0)coins+=2;
  if(ra>=0.7)S.hits++;
  fx(ra>=0.7?'good':ra>=0.3?'mid':'bad',pts,{big:G.fxBig,label:G.fxLabel,light:G.timer});
  if(coins>0){
    S.coins+=coins;G.coins+=coins;coinFx(coins);
    if(fb)fb.insertAdjacentHTML('beforeend','<div class="pts coinline">+'+lus(coins)+'</div>');
  }
  G.fxBig=false;G.fxLabel='';persistSeen();save();
  if(fb){st.appendChild(fb);}
  if(auto){var g=G;setTimeout(function(){if(G===g&&!G.ended)next();},auto);}
  else{var nb=nextBtn(st);setTimeout(function(){fb&&fb.scrollIntoView({block:'nearest',behavior:'smooth'});},30);}
}
function fbBox(cls,big,pts,extra){
  return el('div','fb pop '+cls,'<div class="big">'+big+'</div><div class="pts">'+(pts>0?'+'+nf(pts)+' puntos':'0 puntos')+'</div>'+(extra||''));
}

/* --- Circa: adivina el año --- */
function rCirca(r,st){
  var y=r.e[0],mid=Math.round((r.lo+r.hi)/2);markEv(r.e);
  var c=el('div','card pop','<div class="tag">¿En qué año pasó?</div><p class="ev">'+r.e[1]+'</p>');
  var yr=el('div','year',String(mid));
  var sl=el('input');sl.type='range';sl.id='yr';sl.min=r.lo;sl.max=r.hi;sl.step=1;sl.value=mid;
  sl.setAttribute('aria-label','Año elegido');
  var bd=el('div','bounds','<span>'+r.lo+'</span><span>'+r.hi+'</span>');
  var nu=el('div','nudge');
  [-10,-1,1,10].forEach(function(d){
    var b=el('button',null,(d>0?'+':'−')+Math.abs(d));b.type='button';
    b.addEventListener('click',function(){if(sl.disabled)return;sl.value=Math.max(r.lo,Math.min(r.hi,+sl.value+d));yr.textContent=sl.value;});
    nu.appendChild(b);
  });
  sl.addEventListener('input',function(){yr.textContent=sl.value;});
  c.appendChild(yr);c.appendChild(sl);c.appendChild(bd);c.appendChild(nu);
  var hint=null;
  if(!G.daily){
    hint=el('button','btn alt small hintbtn','Pista · 25 chispas');hint.type='button';
    hint.addEventListener('click',function(){
      if(sl.disabled||hint.disabled)return;
      if(S.coins<25){toast('Te faltan '+lus(25-S.coins)+' para la pista');return;}
      S.coins-=25;coinShown=Math.max(0,coinShown-25);save();
      var W2=Math.max(20,Math.round((r.hi-r.lo)/2));
      var lo=y-Math.floor(W2*(0.2+0.6*Math.random())),hi=lo+W2;
      if(hi>2026){hi=2026;lo=hi-W2;}
      if(lo<1){lo=1;hi=1+W2;}
      r.lo=lo;r.hi=hi;sl.min=lo;sl.max=hi;sl.value=Math.round((lo+hi)/2);yr.textContent=sl.value;
      bd.innerHTML='<span>'+lo+'</span><span>'+hi+'</span>';
      hint.disabled=true;hint.textContent='Pista usada';hud();
      toast('El año está entre <b>'+lo+'</b> y <b>'+hi+'</b>');
    });
    c.appendChild(hint);
  }
  st.appendChild(c);
  var ok=el('button','btn','Confirmar año');ok.type='button';st.appendChild(ok);
  ok.addEventListener('click',function(){
    var g=+sl.value,d=Math.abs(g-y),T=r.W*0.2;
    var pts=Math.max(0,Math.round(1000*(1-d/T)));
    sl.disabled=true;nu.querySelectorAll('button').forEach(function(b){b.disabled=true;});if(hint)hint.disabled=true;ok.remove();
    if(d===0){S.exact++;G.fxBig=true;G.fxLabel='¡Exacto!';}
    var cls=pts>=700?'good':pts>=300?'mid':'bad';
    var msg=d===0?'¡Año exacto!':(d+(d===1?' año':' años')+(g>y?' de más':' de menos'));
    var pg=(g-r.lo)/(r.hi-r.lo)*100,pr=(y-r.lo)/(r.hi-r.lo)*100;
    var sc='<div class="scale"><div class="line"></div><div class="pin me" style="left:'+pg+'%">tú '+g+'</div><div class="dot me" style="left:'+pg+'%"></div><div class="dot real" style="left:'+pr+'%"></div><div class="pin real" style="left:'+pr+'%">'+y+'</div></div>';
    finishRound(pts,1000,fbBox(cls,'Fue en '+y,pts,'<p>'+msg+'.</p>'+sc),st);
  });
}

/* --- ¿Qué fue primero? --- */
function rFirst(r,st){
  var fast=G.timer;markEv(r.a);markEv(r.b);
  var c=el('div','card pop','<div class="tag">¿Qué pasó antes?</div>');
  var wrap=el('div','opts');wrap.style.marginTop='12px';
  var swap=rnd()<0.5;
  var A=swap?r.b:r.a,B=swap?r.a:r.b;
  var first=A[0]<B[0]?A:B;
  var btns=[];
  function mk(ev){
    var b=el('button','opt',ev[1]+'<span class="yr">'+ev[0]+'</span>');b.type='button';
    b.addEventListener('click',function(){
      if(G.done)return;
      btns.forEach(function(x){x.cls.classList.add('lock');});
      var right=(ev===first);
      btns.forEach(function(x){x.cls.classList.add(x.ev===first?'ok':'no');});
      if(right){G.streak++;G.correct++;if(G.streak>G.bestStreak)G.bestStreak=G.streak;}
      else{G.streak=0;if(G.timer)G.lives--;}
      if(G.bestStreak>S.bestFirstStreak)S.bestFirstStreak=G.bestStreak;
      if(right&&G.streak>=3)G.fxLabel='Racha ×'+G.streak;
      var pts=right?(fast?100:500):0,max=fast?100:500;
      if(fast){
        finishRound(pts,max,null,st,right?550:1100);
        if(G.lives<=0){var g=G;setTimeout(function(){if(G===g)endGame();},900);}
      }else{
        finishRound(pts,max,fbBox(right?'good':'bad',right?'¡Correcto!':'Era la otra',pts,'<p>'+first[1]+' fue en '+first[0]+'.</p>'),st);
      }
    });
    btns.push({cls:b,ev:ev});return b;
  }
  wrap.appendChild(mk(A));wrap.appendChild(el('div','vs','— o —'));wrap.appendChild(mk(B));
  c.appendChild(wrap);st.appendChild(c);
}

/* --- Ordena la línea --- */
function rOrder(r,st){
  var c=el('div','card pop','<div class="tag">Del más antiguo al más reciente</div>');
  var ul=el('div','ord');
  var items=r.items.slice(),sel=[];r.items.forEach(function(e){markEv(e);});
  var chk=el('button','btn','Comprobar');chk.type='button';chk.disabled=true;
  var bs=items.map(function(ev){
    var b=el('button',null,'<span class="n"></span><span>'+ev[1]+'</span>');b.type='button';
    b.addEventListener('click',function(){
      if(G.done)return;
      var i=sel.indexOf(ev);
      if(i>-1){sel.length=i;}else{sel.push(ev);}
      bs.forEach(function(x){var k=sel.indexOf(x.ev);x.b.classList.toggle('sel',k>-1);x.b.querySelector('.n').textContent=k>-1?k+1:'';});
      chk.disabled=sel.length!==items.length;
    });
    ul.appendChild(b);return {b:b,ev:ev};
  });
  c.appendChild(ul);st.appendChild(c);st.appendChild(chk);
  chk.addEventListener('click',function(){
    var right=items.slice().sort(function(a,b){return a[0]-b[0];});
    var hits=0;
    var ol=el('div','ord');
    right.forEach(function(ev,i){
      var okp=sel[i]===ev||(sel[i]&&sel[i][0]===ev[0]);
      if(okp)hits++;
      var li=el('li',okp?'ok':'no','<span class="n">'+(i+1)+'</span><span>'+ev[1]+'</span><span class="y">'+ev[0]+'</span>');
      li.style.animationDelay=(i*130)+'ms';ol.appendChild(li);
    });
    if(hits===4)S.perfectOrder++;
    var pts=hits*250;
    c.innerHTML='<div class="tag">Orden correcto</div>';c.appendChild(ol);
    chk.remove();
    finishRound(pts,1000,fbBox(hits===4?'good':hits>=2?'mid':'bad',hits+' de 4 en su sitio',pts),st);
  });
}

/* --- A ojo: estimación --- */
function rEst(r,st){
  var it=r.it;markEst(it);
  var c=el('div','card pop','<div class="tag">Estima la cifra</div><p class="ev">'+it.q+'</p>');
  var row=el('div','numrow');
  var inp=el('input');inp.type='text';inp.id='num';inp.inputMode='decimal';inp.placeholder='0';inp.autocomplete='off';
  inp.setAttribute('aria-label','Tu estimación');
  row.appendChild(inp);row.appendChild(el('span',null,it.u));
  var msg=el('div','msg');
  c.appendChild(row);c.appendChild(msg);st.appendChild(c);
  var ok=el('button','btn','Confirmar cifra');ok.type='button';st.appendChild(ok);
  function go(){
    if(G.done)return;
    var g=parseNum(inp.value);
    if(!(g>0)){msg.textContent='Escribe un número mayor que 0.';c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return;}
    var a=it.a,err=Math.abs(g-a)/a;
    var pts=Math.max(0,Math.round(1000*(1-Math.abs(Math.log(g/a))/Math.log(3))));
    if(err<=0.02)S.tightEst++;
    inp.disabled=true;ok.remove();msg.textContent='';
    var cls=pts>=700?'good':pts>=300?'mid':'bad';
    var pct=Math.round(err*100);
    var extra='<p>Tu cifra: '+nf(g)+' '+it.u+'. '+(pct===0?'Clavada.':'Te has desviado un '+nf(pct)+' %.')+'</p>';
    finishRound(pts,1000,fbBox(cls,'Eran '+nf(a)+' '+it.u,pts,extra),st);
  }
  ok.addEventListener('click',go);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go();}});
}

/* ---------- Fin de partida ---------- */
function endGame(){
  if(!G||G.ended)return;
  G.ended=true;clearInterval(G.iv);
  var g=G,m=MODES[g.mode],E=$('#end');E.innerHTML='';
  var avg=g.res.length?g.res.reduce(function(a,b){return a+b;},0)/g.res.length:0;
  var stars=avg>=0.75?3:avg>=0.5?2:avg>=0.25?1:0;
  var xp=g.timer?g.correct*4:Math.round(g.score/10)+stars*20;
  var before=level();
  S.xp+=xp;S.played++;S.modes[g.mode]=true;
  if(g.mode!=='daily'){
    var val=g.timer?g.correct:g.score;
    if(val>(S.best[g.mode]||0))S.best[g.mode]=val;
  }
  if(g.score>S.bestScore&&!g.timer)S.bestScore=g.score;
  if(g.timer&&g.correct>S.timerBest)S.timerBest=g.correct;

  var today=todayStr(),firstDaily=false;
  if(g.mode==='daily'&&S.dailyDate!==today){
    firstDaily=true;
    S.dailyStreak=(S.dailyDate===yesterdayStr())?S.dailyStreak+1:1;
    S.dailyDate=today;S.dailyScores[today]=g.score;
    if(S.dailyStreak>S.bestDailyStreak)S.bestDailyStreak=S.dailyStreak;
  }
  var bonus=g.timer?0:stars*5+(firstDaily?20:0);
  var coinsBefore=S.coins;S.coins+=bonus;coinShown=coinsBefore;pendingFly=0;
  var got=checkAch();save();

  var c=el('div','card endcard pop');
  var head=g.timer?(g.lives<=0?'Sin vidas':'Se acabó el tiempo'):(stars===3?'¡Memoria de elefante!':stars===2?'Muy buena partida':stars===1?'Vas calentando':'A la próxima sale');
  c.innerHTML='<div class="tag">'+m.name+'</div><h2>'+head+'</h2><div class="score">'+nf(g.score)+'</div>';
  if(g.timer){c.appendChild(el('p',null,'<b>'+g.correct+'</b> aciertos · récord '+S.timerBest));}
  else{
    var sd=el('div','stars');for(var i=0;i<3;i++){sd.appendChild(el('i',i<stars?'on':''));}c.appendChild(sd);
    var sq=el('div','squares');
    g.res.forEach(function(x){sq.appendChild(el('i',x>=0.7?'g':x>=0.3?'y':'r'));});
    c.appendChild(sq);
  }
  c.appendChild(el('div','xpgain','Partida: +'+lus(g.coins+bonus)+(bonus?' (bonus de '+bonus+')':'')));
  c.appendChild(el('div','coinpill big','<i class="coin"></i><b class="cn">0</b>'));
  c.appendChild(el('div','xpgain','+'+xp+' XP'+(level()>before?' · ¡Subes al nivel '+level()+'!':'')));
  E.appendChild(c);

  if(g.mode==='daily'){
    var sqs=g.res.map(function(x){return x>=0.7?'🟩':x>=0.3?'🟨':'🟥';}).join('');
    var text='GoPlayNow · '+today+'\n'+sqs+'\n'+nf(g.score)+' puntos';
    var ta=el('textarea','share');ta.readOnly=true;ta.value=text;ta.id='share';
    ta.setAttribute('aria-label','Resultado para compartir');
    var cp=el('button','btn alt','Copiar resultado');cp.type='button';
    cp.addEventListener('click',function(){
      var fallback=function(){ta.focus();ta.select();cp.textContent='Selecciona y copia el texto';};
      try{navigator.clipboard.writeText(text).then(function(){cp.textContent='Copiado';},fallback);}catch(e){fallback();}
    });
    E.appendChild(ta);E.appendChild(cp);
  }
  var again=el('button','btn',g.mode==='daily'?'Probar otro modo':'Jugar otra vez');again.type='button';
  again.addEventListener('click',function(){if(g.mode==='daily')renderHome();else start(g.mode);});
  var shopE=el('button','btn alt','🛒 Tienda');shopE.type='button';
  shopE.addEventListener('click',function(){renderTienda(false);});
  var home=el('button','btn alt','Inicio');home.type='button';home.addEventListener('click',renderHome);
  E.appendChild(again);E.appendChild(shopE);E.appendChild(home);
  show('end');setCoinNum(coinShown);
  if(bonus>0)setTimeout(function(){coinFx(bonus);},650);
  got.forEach(function(n,i){setTimeout(function(){toast('Logro: <b>'+n+'</b>');},400+i*900);});
}

applyTheme(S.theme);
renderPortal();
})();
</script>
</body></html>
